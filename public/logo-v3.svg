<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1A233A" />
    </linearGradient>

    <linearGradient id="arc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <g id="agent-arm">
      <path d="M 200 80 A 120 120 0 0 1 318.2 179.2" fill="none" stroke="url(#arc-grad)" stroke-width="18" stroke-linecap="round" />
      <circle cx="318.2" cy="179.2" r="24" fill="#FFFFFF" filter="url(#glow)"/>
      <circle cx="318.2" cy="179.2" r="10" fill="#0B0F19" />
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#bg)" rx="60"/>

  <use href="#agent-arm" />
  <use href="#agent-arm" transform="rotate(120 200 200)" />
  <use href="#agent-arm" transform="rotate(240 200 200)" />

  <circle cx="200" cy="200" r="45" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="20" fill="#0B0F19" />
  <circle cx="200" cy="200" r="8" fill="#4FACFE" />
</svg>
